name: test

# Runs inside an ubuntu:24.04 container rather than on the runner's toolchain, so the suite is
# exercised against the box's exact Ruby (3.2) and the distro's minitest — not whatever the runner
# image happens to ship. That fidelity is the reason there is no Gemfile: bundler would fetch a
# minitest from rubygems.org that the box will never have (D_ruby).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the box's Ruby and the dev-only test dependency
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ruby ruby-minitest shellcheck git

      - name: Ruby version (the box's, pinned by D_host_os)
        run: ruby --version

      - run: ruby test/run

      - name: Shellcheck the box scripts
        run: shellcheck shepherd2-install shepherd2-uninstall design/verify_design_tripwires.sh
